<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Наші тарифи</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="pricing" aria-labelledby="pricing-title">
        <div class="container">
          <header class="pricing-header">
            <h1 class="pricing-title" id="pricing-title">Наші тарифи</h1>
            <p class="pricing-description">
              Оберіть план, який найкраще підходить для ваших завдань
            </p>
          </header>
          <div class="pricing-grid">
            <article class="pricing-card" aria-labelledby="basic-title" lang="en">
              <h2 class="pricing-card-title" id="basic-title">Basic</h2>
              <p class="pricing-price">$10 <span class="pricing-period">/ month</span></p>
              <ul class="pricing-features">
                <li>1 User</li>
                <li>5GB Storage</li>
                <li>Basic Support</li>
              </ul>
              <button class="btn btn-outline" type="button">Select</button>
            </article>
            <article
              class="pricing-card pricing-card--featured"
              aria-labelledby="pro-title"
              lang="en"
            >
              <span class="pricing-badge">PRO • ACTIVE</span>
              <h2 class="pricing-card-title" id="pro-title">Pro</h2>
              <p class="pricing-price">$29 <span class="pricing-period">/ month</span></p>
              <ul class="pricing-features">
                <li>5 Users</li>
                <li>50GB Storage</li>
                <li>Priority Support</li>
              </ul>
              <button class="btn btn-primary" type="button">Get Started</button>
            </article>
            <article class="pricing-card" aria-labelledby="enterprise-title" lang="en">
              <h2 class="pricing-card-title" id="enterprise-title">Enterprise</h2>
              <p class="pricing-price">$99 <span class="pricing-period">/ month</span></p>
              <ul class="pricing-features">
                <li>Unlimited</li>
                <li>1TB Storage</li>
                <li>24/7 Support</li>
              </ul>
              <button class="btn btn-outline" type="button">Contact</button>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
